<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passenger - Auxi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-160px) scale(1.6); }
    }
    .floating-emoji {
      position: absolute;
      animation: floatUp 2.5s ease-out forwards;
      pointer-events: none;
      font-size: 2.2rem;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 md:p-8 relative overflow-x-hidden font-sans pb-24">

  <div class="fixed top-12 -right-16 w-80 h-80 bg-indigo-600/20 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="fixed bottom-20 -left-16 w-80 h-80 bg-pink-600/20 rounded-full blur-[100px] pointer-events-none"></div>

  <div id="emoji-container" class="fixed inset-0 pointer-events-none z-50"></div>
  <div class="hidden"><div id="local-player"></div></div>

  <div class="relative z-10 max-w-7xl mx-auto space-y-6">

    <!-- Step 1: Join Session Card -->
    <div id="join-section" class="max-w-md mx-auto bg-slate-900/60 backdrop-blur-2xl p-8 rounded-3xl border border-white/10 space-y-5 text-center shadow-2xl">
      <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300">Join Room Session</h2>
      <input id="user-name" type="text" placeholder="Your Name (e.g. Rahul)" class="w-full p-4 bg-slate-950/80 border border-white/10 rounded-2xl text-sm focus:outline-none focus:border-indigo-500">
      <input id="room-input" type="text" placeholder="Room Code (e.g. AUX1)" class="w-full p-4 bg-slate-950/80 border border-white/10 rounded-2xl text-center uppercase tracking-widest font-mono text-2xl focus:outline-none focus:border-indigo-500">
      <button onclick="joinRoom()" class="w-full py-4 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 font-bold rounded-2xl shadow-xl shadow-indigo-600/30">Join Playlist</button>
    </div>

    <!-- Active Room Dashboard Section -->
    <div id="room-section" class="hidden space-y-6">
      
      <!-- Top Header Controls -->
      <div class="flex flex-col md:flex-row justify-between items-center bg-slate-900/60 backdrop-blur-xl p-5 rounded-3xl border border-white/10 gap-4">
        <div class="flex items-center space-x-4">
          <div>
            <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Active Room</span>
            <p id="active-code" class="font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-pink-400 text-2xl tracking-widest">----</p>
          </div>
        </div>
        
        <div class="flex items-center space-x-3">
          <button id="sync-btn" onclick="toggleSyncAudio()" class="px-4 py-2.5 bg-slate-800 text-slate-300 border border-white/10 rounded-2xl text-xs font-bold shadow">
            🎧 Sync Audio: OFF
          </button>
          
          <button onclick="voteSkip()" class="px-4 py-2.5 bg-red-600/30 border border-red-500/40 text-red-300 hover:bg-red-600 hover:text-white rounded-2xl text-xs font-bold transition shadow">
            Vote Skip ⏭️ (<span id="skip-status">0/1</span>)
          </button>
        </div>
      </div>

      <!-- MAIN PASSENGER HORIZONTAL GRID -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- LEFT COLUMN: TRIVIA & REACTIONS (5 cols) -->
        <div class="lg:col-span-5 space-y-6">
          
          <!-- Live Music Trivia Quiz Card -->
          <div id="trivia-card" class="hidden bg-gradient-to-r from-indigo-950/90 to-purple-950/90 p-6 rounded-3xl border border-indigo-500/40 space-y-4 shadow-2xl">
            <span class="text-xs text-cyan-400 font-bold uppercase tracking-widest">🧠 Live Music Trivia</span>
            <p id="trivia-question" class="text-base text-slate-100 font-bold leading-snug">Loading question...</p>
            <div id="trivia-options" class="grid grid-cols-2 gap-2.5 pt-1"></div>
            <p id="trivia-feedback" class="text-xs font-bold text-center pt-2 hidden"></p>
          </div>

          <!-- Reactions Card -->
          <div class="bg-slate-900/60 backdrop-blur-xl p-5 rounded-3xl border border-white/10 flex justify-around text-2xl shadow-xl">
            <button onclick="sendEmoji('🔥')" class="hover:scale-125 transition">🔥</button>
            <button onclick="sendEmoji('❤️')" class="hover:scale-125 transition">❤️</button>
            <button onclick="sendEmoji('🎧')" class="hover:scale-125 transition">🎧</button>
            <button onclick="sendEmoji('🎉')" class="hover:scale-125 transition">🎉</button>
            <button onclick="sendEmoji('💩')" class="hover:scale-125 transition">💩</button>
          </div>

        </div>

        <!-- RIGHT COLUMN: PRESETS, SEARCH & QUEUE (7 cols) -->
        <div class="lg:col-span-7 space-y-6">
          
          <!-- Ready Preset Playlists -->
          <div class="bg-slate-900/60 backdrop-blur-2xl p-6 rounded-3xl border border-white/10 space-y-4 shadow-xl">
            <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">🔥 Ready Playlists (1-Tap Add)</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 text-xs">
              <button onclick="addPreset('bollywood')" class="p-3.5 bg-gradient-to-r from-amber-600/80 to-orange-600/80 hover:scale-105 border border-amber-400/30 rounded-2xl font-bold text-left shadow transition">
                🎬 Bollywood Hits
              </button>
              <button onclick="addPreset('sandalwood')" class="p-3.5 bg-gradient-to-r from-emerald-600/80 to-teal-600/80 hover:scale-105 border border-emerald-400/30 rounded-2xl font-bold text-left shadow transition">
                🌲 Sandalwood Beats
              </button>
              <button onclick="addPreset('party')" class="p-3.5 bg-gradient-to-r from-purple-600/80 to-pink-600/80 hover:scale-105 border border-pink-400/30 rounded-2xl font-bold text-left shadow transition">
                🎉 Party Melodies
              </button>
              <button onclick="addPreset('tollywood')" class="p-3.5 bg-gradient-to-r from-red-600/80 to-rose-600/80 hover:scale-105 border border-red-400/30 rounded-2xl font-bold text-left shadow transition">
                🔥 Tollywood Hits
              </button>
              <button onclick="addPreset('hollywood')" class="col-span-2 md:col-span-2 p-3.5 bg-gradient-to-r from-cyan-600/80 to-blue-600/80 hover:scale-105 border border-cyan-400/30 rounded-2xl font-bold text-center shadow transition">
                🎧 Hollywood Pop Hits
              </button>
            </div>
          </div>

          <!-- Search Box -->
          <div class="bg-slate-900/60 backdrop-blur-2xl p-6 rounded-3xl border border-white/10 space-y-3 shadow-xl">
            <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">🎵 Search & Queue Song</h3>
            <div class="flex space-x-3">
              <input id="search-query" type="text" placeholder="Type song or artist..." class="w-full p-3.5 bg-slate-950/80 border border-white/10 rounded-2xl text-sm focus:outline-none focus:border-indigo-500">
              <button onclick="searchSong()" class="px-6 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 font-bold text-xs rounded-2xl shadow-md">Search</button>
            </div>
            <div id="search-results" class="space-y-2 mt-3"></div>
          </div>

          <!-- Live Queue -->
          <div class="space-y-3">
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Fair-Play Queue</h4>
            <ul id="passenger-queue" class="space-y-2"></ul>
          </div>

        </div>

      </div>

    </div>

  </div>

  <script>
    const socket = io();
    let joinedRoom = null;
    let searchCache = [];
    let localPlayer = null;
    let isSyncEnabled = false;

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam) {
        document.getElementById('room-input').value = roomParam;
      }
    };

    function onYouTubeIframeAPIReady() {
      localPlayer = new YT.Player('local-player', { height: '0', width: '0' });
    }

    function joinRoom() {
      const name = document.getElementById('user-name').value.trim();
      const code = document.getElementById('room-input').value.trim();
      if (code) socket.emit('join-room', { roomId: code, userName: name });
    }

    socket.on('room-joined', ({ roomId, roomData }) => {
      joinedRoom = roomId;
      document.getElementById('join-section').classList.add('hidden');
      document.getElementById('room-section').classList.remove('hidden');
      document.getElementById('active-code').innerText = roomId;
      renderPassengerQueue(roomData.queue);
    });

    socket.on('error-msg', (msg) => alert(msg));

    function addPreset(playlistKey) {
      if (joinedRoom) {
        socket.emit('add-preset-playlist', { roomId: joinedRoom, playlistKey });
      }
    }

    function sendEmoji(emoji) {
      if (joinedRoom) socket.emit('send-reaction', { roomId: joinedRoom, emoji });
    }

    socket.on('new-reaction', ({ emoji }) => spawnFloatingEmoji(emoji));

    function spawnFloatingEmoji(emoji) {
      const container = document.getElementById('emoji-container');
      const el = document.createElement('div');
      el.innerText = emoji;
      el.className = 'floating-emoji';
      el.style.left = `${Math.random() * 80 + 10}%`;
      el.style.bottom = '20px';
      container.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    function voteSkip() {
      if (joinedRoom) socket.emit('vote-skip', { roomId: joinedRoom });
    }

    socket.on('skip-updated', ({ skipCount, totalMembers }) => {
      document.getElementById('skip-status').innerText = `${skipCount}/${Math.ceil(totalMembers / 2)}`;
    });

    function toggleSyncAudio() {
      isSyncEnabled = !isSyncEnabled;
      const btn = document.getElementById('sync-btn');
      if (isSyncEnabled) {
        btn.innerText = '🎧 Sync Audio: ON';
        btn.className = 'px-4 py-2.5 bg-indigo-600 text-white border border-indigo-400 rounded-2xl text-xs font-bold shadow';
      } else {
        btn.innerText = '🎧 Sync Audio: OFF';
        btn.className = 'px-4 py-2.5 bg-slate-800 text-slate-300 border border-white/10 rounded-2xl text-xs font-bold shadow';
        if (localPlayer) localPlayer.stopVideo();
      }
    }

    socket.on('play-next', (data) => {
      renderPassengerQueue(data.queue);
      
      const triviaCard = document.getElementById('trivia-card');
      const feedback = document.getElementById('trivia-feedback');
      feedback.classList.add('hidden');

      if (data.currentTrivia) {
        triviaCard.classList.remove('hidden');
        document.getElementById('trivia-question').innerText = data.currentTrivia.question;
        
        const optionsDiv = document.getElementById('trivia-options');
        optionsDiv.innerHTML = data.currentTrivia.options.map((opt, idx) => `
          <button onclick="submitTrivia(${idx})" class="p-3 bg-indigo-900/50 hover:bg-indigo-600 border border-indigo-500/30 rounded-xl text-xs font-medium text-left truncate transition">
            ${opt}
          </button>
        `).join('');
      } else {
        triviaCard.classList.add('hidden');
      }

      if (isSyncEnabled && localPlayer && data.currentSong) {
        localPlayer.loadVideoById(data.currentSong.videoId);
      }
    });

    function submitTrivia(selectedIndex) {
      if (joinedRoom) {
        socket.emit('submit-trivia-answer', { roomId: joinedRoom, selectedIndex });
      }
    }

    socket.on('trivia-result', ({ isCorrect, correctAnswer }) => {
      const feedback = document.getElementById('trivia-feedback');
      feedback.classList.remove('hidden');
      if (isCorrect) {
        feedback.innerText = "🎉 Right Answer! You know your music!";
        feedback.className = "text-xs font-bold text-center pt-2 text-green-400";
      } else {
        feedback.innerText = `❌ Wrong Answer! Correct answer was: ${correctAnswer}`;
        feedback.className = "text-xs font-bold text-center pt-2 text-red-400";
      }
    });

    async function searchSong() {
      const query = document.getElementById('search-query').value.trim();
      if (!query) return;
      const resultsDiv = document.getElementById('search-results');
      resultsDiv.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">Searching songs...</p>`;
      
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        searchCache = await res.json();
        if (!searchCache || searchCache.length === 0) {
          resultsDiv.innerHTML = `<p class="text-xs text-slate-500 text-center py-2">No songs found.</p>`;
          return;
        }
        resultsDiv.innerHTML = searchCache.map((s, index) => `
          <div class="flex items-center justify-between bg-slate-950/90 p-3 rounded-2xl border border-white/10">
            <div class="flex items-center space-x-3 truncate">
              ${s.thumbnail ? `<img src="${s.thumbnail}" class="w-10 h-10 rounded-lg object-cover">` : ''}
              <div class="truncate">
                <p class="font-medium text-xs text-white truncate">${s.title}</p>
                <p class="text-[10px] text-indigo-300/70">${s.artist}</p>
              </div>
            </div>
            <button onclick="addCachedSong(${index})" class="px-4 py-2 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-xs font-bold rounded-xl shadow">
              + Queue
            </button>
          </div>
        `).join('');
      } catch (err) {
        resultsDiv.innerHTML = `<p class="text-xs text-red-400 text-center py-2">Search failed. Try again.</p>`;
      }
    }

    function addCachedSong(index) {
      const song = searchCache[index];
      if (joinedRoom && song) {
        socket.emit('add-song', { 
          roomId: joinedRoom, 
          song: { title: song.title, videoId: song.videoId, thumbnail: song.thumbnail, artist: song.artist } 
        });
        document.getElementById('search-results').innerHTML = '';
        document.getElementById('search-query').value = '';
      }
    }

    function upvote(songId) {
      if (joinedRoom) socket.emit('upvote-song', { roomId: joinedRoom, songId });
    }

    socket.on('queue-updated', (data) => renderPassengerQueue(data.queue));

    function renderPassengerQueue(queue) {
      const list = document.getElementById('passenger-queue');
      if (!queue || queue.length === 0) {
        list.innerHTML = `<li class="p-4 bg-slate-900/40 backdrop-blur-md rounded-2xl text-slate-500 text-sm text-center border border-white/5">Queue is empty</li>`;
        return;
      }
      list.innerHTML = queue.map((song) => `
        <li class="p-3.5 bg-slate-900/60 backdrop-blur-xl rounded-2xl flex justify-between items-center border border-white/10 shadow-lg">
          <div class="flex items-center space-x-3 truncate">
            ${song.thumbnail ? `<img src="${song.thumbnail}" class="w-12 h-12 rounded-xl object-cover">` : ''}
            <div class="truncate">
              <p class="font-medium text-sm text-slate-100 truncate">${song.title}</p>
              <p class="text-xs text-indigo-300/70">By ${song.addedBy}</p>
            </div>
          </div>
          <button onclick="upvote('${song.id}')" class="px-4 py-2 bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 font-bold text-xs rounded-xl hover:bg-indigo-600 hover:text-white transition">
            👍 ${song.votes}
          </button>
        </li>
      `).join('');
    }
  </script>
</body>
</html>
