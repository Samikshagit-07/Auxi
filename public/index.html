<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auxi - Pass the Aux Digitally</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-25px) rotate(12deg) scale(1.1); }
    }
    @keyframes floatFast {
      0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-18px) rotate(-15deg) scale(0.95); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    .animate-float-1 { animation: floatSlow 6s ease-in-out infinite; }
    .animate-float-2 { animation: floatFast 4s ease-in-out infinite; }
    .animate-float-3 { animation: floatSlow 8s ease-in-out infinite; }
    .animate-glow { animation: pulseGlow 5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-sans">

  <!-- Neon Ambient Background Glows -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/30 rounded-full blur-[120px] pointer-events-none animate-glow"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-pink-600/25 rounded-full blur-[120px] pointer-events-none animate-glow"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-cyan-500/10 rounded-full blur-[150px] pointer-events-none"></div>

  <!-- Background Music Symbols Floating Around -->
  <span class="absolute top-10 left-8 text-7xl text-indigo-400/20 blur-[1px] animate-float-1 select-none pointer-events-none">🎵</span>
  <span class="absolute bottom-16 left-12 text-8xl text-pink-400/20 blur-[2px] animate-float-2 select-none pointer-events-none">🎶</span>
  <span class="absolute top-1/4 right-10 text-9xl text-cyan-400/15 blur-[3px] animate-float-3 select-none pointer-events-none">🎧</span>
  <span class="absolute bottom-12 right-1/4 text-6xl text-purple-400/25 blur-[1px] animate-float-1 select-none pointer-events-none">🎼</span>
  <span class="absolute top-12 right-1/3 text-7xl text-indigo-500/15 blur-[2px] animate-float-2 select-none pointer-events-none">🎸</span>
  <span class="absolute bottom-1/3 left-1/4 text-6xl text-cyan-300/15 blur-[2px] animate-float-3 select-none pointer-events-none">🎷</span>

  <!-- Frosted Glass Card -->
  <div class="relative z-10 max-w-md w-full bg-slate-900/70 backdrop-blur-2xl rounded-3xl p-8 border border-white/10 shadow-2xl text-center space-y-6">
    <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 rounded-3xl shadow-lg shadow-indigo-500/30 mb-1 border border-white/20">
      <span class="text-4xl animate-bounce">⚡</span>
    </div>

    <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 via-pink-300 to-cyan-300 tracking-tight">Auxi</h1>
    <p class="text-slate-400 text-sm leading-relaxed">Pass the aux digitally. Real-time song queuing, voting, and music trivia vibes.</p>
    
    <div class="space-y-3 pt-2">
      <a href="/host.html" class="block w-full py-4 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 font-bold rounded-2xl transition duration-300 shadow-xl shadow-indigo-600/30 border border-white/10 text-sm tracking-wide">
        🚗 Driver Host Mode
      </a>
      <a href="/passenger.html" class="block w-full py-4 bg-slate-800/80 hover:bg-slate-800 font-bold rounded-2xl transition duration-300 border border-white/10 backdrop-blur-md text-sm text-slate-200">
        📱 Passenger Join Mode
      </a>
    </div>
  </div>

</body>
</html>
