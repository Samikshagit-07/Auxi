<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Room - Auxi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-160px) scale(1.6); }
    }
    .floating-emoji {
      position: absolute;
      animation: floatUp 2.5s ease-out forwards;
      pointer-events: none;
      font-size: 2.2rem;
    }
    @keyframes eqBar {
      0%, 100% { height: 4px; }
      50% { height: 20px; }
    }
    .eq-bar { animation: eqBar 0.8s ease-in-out infinite; }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; }
    .eq-bar:nth-child(4) { animation-delay: 0.1s; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 max-w-lg mx-auto relative overflow-x-hidden font-sans pb-20">

  <div class="fixed top-10 -left-20 w-80 h-80 bg-indigo-600/20 rounded-full blur-[110px] pointer-events-none"></div>
  <div class="fixed bottom-10 -right-20 w-80 h-80 bg-pink-600/20 rounded-full blur-[110px] pointer-events-none"></div>

  <div id="emoji-container" class="fixed inset-0 pointer-events-none z-50"></div>

  <div class="relative z-10 space-y-5">
    
    <!-- Step 1: Driver Setup -->
    <div id="create-card" class="bg-slate-900/70 backdrop-blur-2xl p-6 rounded-3xl border border-white/10 shadow-2xl space-y-4">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Driver / Host Setup</h2>
      <input id="host-name-input" type="text" placeholder="Driver Name (e.g. Samiksha / Host)" class="w-full p-3.5 bg-slate-950/80 border border-white/10 rounded-2xl text-sm focus:outline-none focus:border-indigo-500">

      <div class="space-y-2">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Select Room Vibe</span>
        <div class="grid grid-cols-3 gap-2 text-xs">
          <button onclick="setMode('🚗 Road Trip')" class="mode-btn active p-3 bg-indigo-600 border border-indigo-400 rounded-2xl font-bold">🚗 Road Trip</button>
          <button onclick="setMode('🏠 House Party')" class="mode-btn p-3 bg-slate-800 border border-white/10 rounded-2xl font-bold">🏠 Party</button>
          <button onclick="setMode('🌐 Long Distance')" class="mode-btn p-3 bg-slate-800 border border-white/10 rounded-2xl font-bold">🌐 Virtual</button>
        </div>
      </div>

      <button onclick="createRoom()" class="w-full py-4 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 font-bold text-sm rounded-2xl shadow-lg shadow-indigo-600/30 border border-white/10">
        Start Session & Pass Aux ⚡
      </button>
    </div>

    <!-- Header -->
    <div id="room-header" class="hidden bg-slate-900/60 backdrop-blur-2xl p-5 rounded-3xl border border-white/10 shadow-xl flex justify-between items-center">
      <div>
        <span id="active-mode-tag" class="text-[10px] text-indigo-400 font-bold uppercase tracking-widest">---</span>
        <h2 id="room-code" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-pink-400 to-cyan-400 tracking-widest">---</h2>
        <div id="member-count" class="text-xs bg-indigo-500/20 text-indigo-300 font-bold px-3 py-1 rounded-full border border-indigo-500/30 inline-block mt-2">0 Passengers</div>
      </div>
      
      <div class="text-center">
        <img id="qr-code-img" class="w-20 h-20 rounded-xl border border-white/20 p-1 bg-white shadow-lg">
        <span class="text-[9px] text-slate-400 font-bold uppercase block mt-1">Scan to Join</span>
      </div>
    </div>

    <!-- Live Members -->
    <div id="members-card" class="hidden bg-slate-900/50 backdrop-blur-xl p-4 rounded-2xl border border-white/5">
      <div id="members-list" class="flex flex-wrap gap-2 text-xs">
        <span class="text-slate-500 text-xs">Waiting for passengers...</span>
      </div>
    </div>

    <div class="hidden"><div id="player"></div></div>

    <!-- Now Playing Glass Card -->
    <div id="player-card" class="hidden bg-slate-900/70 backdrop-blur-2xl p-6 rounded-3xl border border-white/10 text-center space-y-4 shadow-2xl">
      <div class="flex justify-center items-center space-x-2">
        <div class="flex items-end space-x-1 h-5">
          <div class="w-1 bg-pink-500 rounded-full eq-bar"></div>
          <div class="w-1 bg-indigo-400 rounded-full eq-bar"></div>
          <div class="w-1 bg-cyan-400 rounded-full eq-bar"></div>
          <div class="w-1 bg-purple-500 rounded-full eq-bar"></div>
        </div>
        <span class="text-[10px] text-indigo-400 font-bold uppercase tracking-widest">⚡ Now Playing</span>
      </div>

      <div>
        <h3 id="now-playing" class="text-lg font-bold truncate text-slate-100">No active track</h3>
        <p id="added-by" class="text-xs text-indigo-300/70 font-medium"></p>
      </div>

      <div class="flex justify-center items-center space-x-4 pt-2 border-t border-white/5">
        <button onclick="toggleMute()" id="mute-btn" class="p-3 bg-slate-800/80 text-slate-300 rounded-2xl border border-white/10 text-sm">🔊</button>
        <button onclick="togglePlayPause()" id="play-btn" class="p-4 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white rounded-2xl shadow-lg border border-white/10 text-lg font-bold">⏸️ Pause</button>
        <button onclick="skipSong()" class="p-3 bg-slate-800/80 text-slate-300 rounded-2xl border border-white/10 text-sm font-bold">⏭️ Skip</button>
      </div>
    </div>

    <!-- Ready Playlists with Instant Switcher Mode -->
    <div id="host-preset-card" class="hidden bg-slate-900/60 backdrop-blur-2xl p-4 rounded-3xl border border-white/10 space-y-3 shadow-xl">
      <div class="flex justify-between items-center">
        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">🔥 Switch Vibe Playlist</h3>
        <button onclick="toggleSwitchMode()" id="switch-mode-btn" class="text-[10px] font-bold px-2.5 py-1 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded-lg">
          🔄 Mode: Replace Queue
        </button>
      </div>

      <div class="grid grid-cols-2 gap-2 text-xs">
        <button onclick="switchPreset('bollywood')" class="p-3 bg-gradient-to-r from-amber-600/80 to-orange-600/80 hover:scale-105 border border-amber-400/30 rounded-2xl font-bold text-left shadow transition">
          🎬 Bollywood Hits
        </button>
        <button onclick="switchPreset('sandalwood')" class="p-3 bg-gradient-to-r from-emerald-600/80 to-teal-600/80 hover:scale-105 border border-emerald-400/30 rounded-2xl font-bold text-left shadow transition">
          🌲 Sandalwood Beats
        </button>
        <button onclick="switchPreset('party')" class="p-3 bg-gradient-to-r from-purple-600/80 to-pink-600/80 hover:scale-105 border border-pink-400/30 rounded-2xl font-bold text-left shadow transition">
          🎉 Party Melodies
        </button>
        <button onclick="switchPreset('tollywood')" class="p-3 bg-gradient-to-r from-red-600/80 to-rose-600/80 hover:scale-105 border border-red-400/30 rounded-2xl font-bold text-left shadow transition">
          🔥 Tollywood Hits
        </button>
        <button onclick="switchPreset('hollywood')" class="col-span-2 p-3 bg-gradient-to-r from-cyan-600/80 to-blue-600/80 hover:scale-105 border border-cyan-400/30 rounded-2xl font-bold text-center shadow transition">
          🎧 Hollywood Pop Hits
        </button>
      </div>
    </div>

    <!-- Search Box -->
    <div id="host-search-card" class="hidden bg-slate-900/60 backdrop-blur-2xl p-5 rounded-3xl border border-white/10 space-y-3 shadow-xl">
      <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">🎵 Search Song</h3>
      <div class="flex space-x-2">
        <input id="search-query" type="text" placeholder="Type song or artist..." class="w-full p-3 bg-slate-950/80 border border-white/10 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
        <button onclick="searchSong()" class="px-5 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 font-bold text-xs rounded-xl shadow-md">Search</button>
      </div>
      <div id="search-results" class="space-y-2 mt-3"></div>
    </div>

    <!-- Reactions -->
    <div id="host-reactions" class="hidden bg-slate-900/60 backdrop-blur-xl p-3 rounded-2xl border border-white/10 flex justify-around text-xl">
      <button onclick="sendEmoji('🔥')" class="hover:scale-125 transition">🔥</button>
      <button onclick="sendEmoji('❤️')" class="hover:scale-125 transition">❤️</button>
      <button onclick="sendEmoji('🎧')" class="hover:scale-125 transition">🎧</button>
      <button onclick="sendEmoji('🎉')" class="hover:scale-125 transition">🎉</button>
      <button onclick="sendEmoji('💩')" class="hover:scale-125 transition">💩</button>
    </div>

    <!-- Live Queue + Clear Control -->
    <div id="host-queue-card" class="hidden space-y-2">
      <div class="flex justify-between items-center px-1">
        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Car Queue</h4>
        <button onclick="clearQueue()" class="text-[10px] font-bold px-3 py-1 bg-red-600/20 text-red-300 border border-red-500/30 hover:bg-red-600 hover:text-white rounded-lg transition">
          🗑️ Clear Queue
        </button>
      </div>
      <ul id="queue-list" class="space-y-2">
        <li class="p-4 bg-slate-900/40 backdrop-blur-md rounded-2xl text-slate-500 text-sm text-center border border-white/5">Queue is empty</li>
      </ul>
    </div>
  </div>

  <script>
    const socket = io();
    let currentRoom = null;
    let selectedMode = '🚗 Road Trip';
    let ytPlayer = null;
    let isPlaying = false;
    let isMuted = false;
    let searchCache = [];
    let switchMode = 'replace'; // 'replace' or 'append'

    function setMode(mode) {
      selectedMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'border-indigo-400');
        btn.classList.add('bg-slate-800', 'border-white/10');
      });
      event.target.classList.add('bg-indigo-600', 'border-indigo-400');
    }

    function toggleSwitchMode() {
      const btn = document.getElementById('switch-mode-btn');
      if (switchMode === 'replace') {
        switchMode = 'append';
        btn.innerText = '➕ Mode: Append Queue';
        btn.className = 'text-[10px] font-bold px-2.5 py-1 bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 rounded-lg';
      } else {
        switchMode = 'replace';
        btn.innerText = '🔄 Mode: Replace Queue';
        btn.className = 'text-[10px] font-bold px-2.5 py-1 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded-lg';
      }
    }

    function switchPreset(playlistKey) {
      if (currentRoom) {
        socket.emit('switch-preset-playlist', { roomId: currentRoom, playlistKey, mode: switchMode });
      }
    }

    function clearQueue() {
      if (currentRoom && confirm("Are you sure you want to clear the upcoming queue?")) {
        socket.emit('clear-queue', { roomId: currentRoom });
      }
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        height: '0', width: '0',
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function createRoom() {
      const hostName = document.getElementById('host-name-input').value.trim();
      socket.emit('create-room', { mode: selectedMode, hostName });
    }

    socket.on('room-created', ({ roomId, mode, qrCodeData, hostName }) => {
      currentRoom = roomId;
      document.getElementById('create-card').classList.add('hidden');
      document.getElementById('room-header').classList.remove('hidden');
      document.getElementById('members-card').classList.remove('hidden');
      document.getElementById('player-card').classList.remove('hidden');
      document.getElementById('host-preset-card').classList.remove('hidden');
      document.getElementById('host-search-card').classList.remove('hidden');
      document.getElementById('host-reactions').classList.remove('hidden');
      document.getElementById('host-queue-card').classList.remove('hidden');

      document.getElementById('room-code').innerText = roomId;
      document.getElementById('active-mode-tag').innerText = mode;
      document.getElementById('qr-code-img').src = qrCodeData;
    });

    socket.on('members-updated', ({ members }) => {
      document.getElementById('member-count').innerText = `${members.length} Passengers`;
      const list = document.getElementById('members-list');
      if (members.length === 0) {
        list.innerHTML = `<span class="text-slate-500 text-xs">Waiting for passengers...</span>`;
      } else {
        list.innerHTML = members.map(m => `
          <span class="bg-slate-800/80 border border-white/10 text-slate-200 px-3 py-1 rounded-full text-xs font-medium">👤 ${m.name}</span>
        `).join('');
      }
    });

    function sendEmoji(emoji) {
      if (currentRoom) socket.emit('send-reaction', { roomId: currentRoom, emoji });
    }

    socket.on('new-reaction', ({ emoji }) => spawnFloatingEmoji(emoji));

    function spawnFloatingEmoji(emoji) {
      const container = document.getElementById('emoji-container');
      const el = document.createElement('div');
      el.innerText = emoji;
      el.className = 'floating-emoji';
      el.style.left = `${Math.random() * 80 + 10}%`;
      el.style.bottom = '20px';
      container.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    async function searchSong() {
      const queryInput = document.getElementById('search-query');
      if (!queryInput) return;
      const query = queryInput.value.trim();
      if (!query) return;

      const resultsDiv = document.getElementById('search-results');
      resultsDiv.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">Searching songs...</p>`;
      
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        searchCache = await res.json();
        
        if (!searchCache || searchCache.length === 0) {
          resultsDiv.innerHTML = `<p class="text-xs text-slate-500 text-center py-2">No songs found.</p>`;
          return;
        }
        
        resultsDiv.innerHTML = searchCache.map((s, index) => `
          <div class="flex items-center justify-between bg-slate-950/90 p-2.5 rounded-xl border border-white/10">
            <div class="flex items-center space-x-3 truncate">
              ${s.thumbnail ? `<img src="${s.thumbnail}" class="w-10 h-10 rounded-lg object-cover">` : ''}
              <div class="truncate">
                <p class="font-medium text-xs text-white truncate">${s.title}</p>
                <p class="text-[10px] text-indigo-300/70">${s.artist}</p>
              </div>
            </div>
            <button onclick="addCachedSong(${index})" class="px-3 py-1.5 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-xs font-bold rounded-lg shadow flex-shrink-0">
              + Queue
            </button>
          </div>
        `).join('');
      } catch (err) {
        resultsDiv.innerHTML = `<p class="text-xs text-red-400 text-center py-2">Search failed. Try again.</p>`;
      }
    }

    function addCachedSong(index) {
      const song = searchCache[index];
      if (currentRoom && song) {
        socket.emit('add-song', { 
          roomId: currentRoom, 
          song: { title: song.title, videoId: song.videoId, thumbnail: song.thumbnail, artist: song.artist } 
        });
        document.getElementById('search-results').innerHTML = '';
        document.getElementById('search-query').value = '';
      }
    }

    function upvote(songId) {
      if (currentRoom) socket.emit('upvote-song', { roomId: currentRoom, songId });
    }

    socket.on('queue-updated', (data) => {
      renderQueue(data.queue);
      if (!data.currentSong && data.queue.length > 0) {
        socket.emit('song-ended', { roomId: currentRoom });
      }
    });

    socket.on('play-next', (data) => {
      renderQueue(data.queue);
      if (data.currentSong) {
        document.getElementById('now-playing').innerText = data.currentSong.title;
        document.getElementById('added-by').innerText = `Queued by ${data.currentSong.addedBy || 'Driver'}`;
        ytPlayer.loadVideoById(data.currentSong.videoId);
        isPlaying = true;
        document.getElementById('play-btn').innerText = '⏸️ Pause';
      } else {
        document.getElementById('now-playing').innerText = "No active track";
        document.getElementById('added-by').innerText = "";
        isPlaying = false;
        document.getElementById('play-btn').innerText = '▶️ Play';
      }
    });

    function togglePlayPause() {
      if (!ytPlayer) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
        isPlaying = false;
        document.getElementById('play-btn').innerText = '▶️ Play';
      } else {
        ytPlayer.playVideo();
        isPlaying = true;
        document.getElementById('play-btn').innerText = '⏸️ Pause';
      }
    }

    function toggleMute() {
      if (!ytPlayer) return;
      if (isMuted) {
        ytPlayer.unMute();
        isMuted = false;
        document.getElementById('mute-btn').innerText = '🔊';
      } else {
        ytPlayer.mute();
        isMuted = true;
        document.getElementById('mute-btn').innerText = '🔇';
      }
    }

    function skipSong() {
      if (currentRoom) socket.emit('song-ended', { roomId: currentRoom });
    }

    function onPlayerStateChange(event) {
      if (event.data === 0 && currentRoom) {
        socket.emit('song-ended', { roomId: currentRoom });
      }
    }

    function renderQueue(queue) {
      const list = document.getElementById('queue-list');
      if (!queue || queue.length === 0) {
        list.innerHTML = `<li class="p-4 bg-slate-900/40 backdrop-blur-md rounded-2xl text-slate-500 text-sm text-center border border-white/5">Queue is empty</li>`;
        return;
      }
      list.innerHTML = queue.map((song) => `
        <li class="p-3 bg-slate-900/60 backdrop-blur-xl rounded-2xl flex items-center justify-between border border-white/10 shadow-lg">
          <div class="flex items-center space-x-3 truncate">
            ${song.thumbnail ? `<img src="${song.thumbnail}" class="w-11 h-11 rounded-xl object-cover border border-white/10">` : ''}
            <div class="truncate">
              <p class="font-medium text-sm text-slate-100 truncate">${song.title}</p>
              <p class="text-[11px] text-indigo-300/70">By ${song.addedBy}</p>
            </div>
          </div>
          <button onclick="upvote('${song.id}')" class="px-3.5 py-1.5 bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 font-bold text-xs rounded-xl hover:bg-indigo-600 hover:text-white transition">
            👍 ${song.votes}
          </button>
        </li>
      `).join('');
    }
  </script>
</body>
</html>
