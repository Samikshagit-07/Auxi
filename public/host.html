<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Room - Auxi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-160px) scale(1.6); }
    }
    .floating-emoji {
      position: absolute;
      animation: floatUp 2.5s ease-out forwards;
      pointer-events: none;
      font-size: 2.2rem;
    }
    @keyframes eqBar {
      0%, 100% { height: 4px; }
      50% { height: 24px; }
    }
    .eq-bar { animation: eqBar 0.8s ease-in-out infinite; }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; }
    .eq-bar:nth-child(4) { animation-delay: 0.1s; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 md:p-8 relative overflow-x-hidden font-sans">

  <div class="fixed top-10 -left-20 w-96 h-96 bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="fixed bottom-10 -right-20 w-96 h-96 bg-pink-600/20 rounded-full blur-[120px] pointer-events-none"></div>

  <div id="emoji-container" class="fixed inset-0 pointer-events-none z-50"></div>

  <div class="relative z-10 max-w-7xl mx-auto space-y-6">
    
    <!-- Setup Card -->
    <div id="create-card" class="max-w-xl mx-auto bg-slate-900/70 backdrop-blur-2xl p-8 rounded-3xl border border-white/10 shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 via-pink-300 to-cyan-300">Driver Host Setup</h1>
        <p class="text-xs text-slate-400">Initialize room and pass the aux digitally</p>
      </div>

      <input id="host-name-input" type="text" placeholder="Driver / Host Name (e.g. Samiksha)" class="w-full p-4 bg-slate-950/80 border border-white/10 rounded-2xl text-sm focus:outline-none focus:border-indigo-500">

      <div class="space-y-2">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Select Room Vibe</span>
        <div class="grid grid-cols-3 gap-3 text-xs">
          <button onclick="setMode('🚗 Road Trip')" class="mode-btn active p-3.5 bg-indigo-600 border border-indigo-400 rounded-2xl font-bold">🚗 Road Trip</button>
          <button onclick="setMode('🏠 House Party')" class="mode-btn p-3.5 bg-slate-800 border border-white/10 rounded-2xl font-bold">🏠 Party</button>
          <button onclick="setMode('🌐 Long Distance')" class="mode-btn p-3.5 bg-slate-800 border border-white/10 rounded-2xl font-bold">🌐 Virtual</button>
        </div>
      </div>

      <button onclick="createRoom()" class="w-full py-4 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 font-bold text-sm rounded-2xl shadow-xl shadow-indigo-600/30 border border-white/10">
        Start Session & Pass Aux ⚡
      </button>
    </div>

    <!-- Active Room Dashboard Header -->
    <div id="room-header" class="hidden bg-slate-900/60 backdrop-blur-2xl p-6 rounded-3xl border border-white/10 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="space-y-1 text-center md:text-left">
        <span id="active-mode-tag" class="text-xs text-indigo-400 font-bold uppercase tracking-widest">---</span>
        <div class="flex items-center space-x-3 justify-center md:justify-start">
          <h2 id="room-code" class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-pink-400 to-cyan-400 tracking-widest">---</h2>
          <div id="member-count" class="text-xs bg-indigo-500/20 text-indigo-300 font-bold px-4 py-1.5 rounded-full border border-indigo-500/30">0 Passengers</div>
        </div>
      </div>
      
      <div id="members-card" class="flex-1 max-w-md hidden md:block">
        <div id="members-list" class="flex flex-wrap justify-center md:justify-start gap-2 text-xs">
          <span class="text-slate-500 text-xs">Waiting for passengers...</span>
        </div>
      </div>

      <div class="flex items-center space-x-4">
        <img id="qr-code-img" class="w-16 h-16 rounded-xl border border-white/20 p-1 bg-white shadow-lg">
        <div class="text-left">
          <span class="text-[10px] text-slate-400 font-bold uppercase block">Scan to Join</span>
          <span class="text-xs text-indigo-300 font-medium">Connect Phone</span>
        </div>
      </div>
    </div>

    <div class="hidden"><div id="player"></div></div>

    <!-- MAIN HORIZONTAL DASHBOARD GRID -->
    <div id="dashboard-grid" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      
      <!-- LEFT COLUMN -->
      <div class="lg:col-span-5 space-y-6">
        
        <div id="player-card" class="bg-slate-900/70 backdrop-blur-2xl p-8 rounded-3xl border border-white/10 text-center space-y-6 shadow-2xl">
          <div class="flex justify-center items-center space-x-3">
            <div class="flex items-end space-x-1 h-6">
              <div class="w-1.5 bg-pink-500 rounded-full eq-bar"></div>
              <div class="w-1.5 bg-indigo-400 rounded-full eq-bar"></div>
              <div class="w-1.5 bg-cyan-400 rounded-full eq-bar"></div>
              <div class="w-1.5 bg-purple-500 rounded-full eq-bar"></div>
            </div>
            <span class="text-xs text-indigo-400 font-bold uppercase tracking-widest">⚡ Now Playing</span>
          </div>

          <div class="space-y-1">
            <h3 id="now-playing" class="text-xl font-bold truncate text-slate-100">No active track</h3>
            <p id="added-by" class="text-xs text-indigo-300/70 font-medium"></p>
          </div>

          <div class="flex justify-center items-center space-x-4 pt-4 border-t border-white/5">
            <button onclick="toggleMute()" id="mute-btn" class="p-4 bg-slate-800/80 text-slate-300 rounded-2xl border border-white/10 text-base">🔊</button>
            <button onclick="togglePlayPause()" id="play-btn" class="px-8 py-4 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white rounded-2xl shadow-xl border border-white/10 text-base font-bold">⏸️ Pause</button>
            <button onclick="skipSong()" class="p-4 bg-slate-800/80 text-slate-300 rounded-2xl border border-white/10 text-base font-bold">⏭️ Skip</button>
          </div>
        </div>

        <div id="host-reactions" class="bg-slate-900/60 backdrop-blur-xl p-4 rounded-3xl border border-white/10 flex justify-around text-2xl">
          <button onclick="sendEmoji('🔥')" class="hover:scale-125 transition">🔥</button>
          <button onclick="sendEmoji('❤️')" class="hover:scale-125 transition">❤️</button>
          <button onclick="sendEmoji('🎧')" class="hover:scale-125 transition">🎧</button>
          <button onclick="sendEmoji('🎉')" class="hover:scale-125 transition">🎉</button>
          <button onclick="sendEmoji('💩')" class="hover:scale-125 transition">💩</button>
        </div>

      </div>

      <!-- RIGHT COLUMN -->
      <div class="lg:col-span-7 space-y-6">
        
        <div id="host-preset-card" class="bg-slate-900/60 backdrop-blur-2xl p-6 rounded-3xl border border-white/10 space-y-4 shadow-xl">
          <div class="flex justify-between items-center">
            <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">🔥 Switch Vibe Playlist</h3>
            <button onclick="toggleSwitchMode()" id="switch-mode-btn" class="text-[10px] font-bold px-3 py-1.5 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded-xl">
              🔄 Mode: Replace Queue
            </button>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-3 gap-3 text-xs">
            <button onclick="switchPreset('bollywood')" class="p-3.5 bg-gradient-to-r from-amber-600/80 to-orange-600/80 hover:scale-105 border border-amber-400/30 rounded-2xl font-bold text-left shadow transition">
              🎬 Bollywood Hits
            </button>
            <button onclick="switchPreset('sandalwood')" class="p-3.5 bg-gradient-to-r from-emerald-600/80 to-teal-600/80 hover:scale-105 border border-emerald-400/30 rounded-2xl font-bold text-left shadow transition">
              🌲 Sandalwood Beats
            </button>
            <button onclick="switchPreset('party')" class="p-3.5 bg-gradient-to-r from-purple-600/80 to-pink-600/80 hover:scale-105 border border-pink-400/30 rounded-2xl font-bold text-left shadow transition">
              🎉 Party Melodies
            </button>
            <button onclick="switchPreset('tollywood')" class="p-3.5 bg-gradient-to-r from-red-600/80 to-rose-600/80 hover:scale-105 border border-red-400/30 rounded-2xl font-bold text-left shadow transition">
              🔥 Tollywood Hits
            </button>
            <button onclick="switchPreset('hollywood')" class="col-span-2 md:col-span-2 p-3.5 bg-gradient-to-r from-cyan-600/80 to-blue-600/80 hover:scale-105 border border-cyan-400/30 rounded-2xl font-bold text-center shadow transition">
              🎧 Hollywood Pop Hits
            </button>
          </div>
        </div>

        <div id="host-search-card" class="bg-slate-900/60 backdrop-blur-2xl p-6 rounded-3xl border border-white/10 space-y-3 shadow-xl">
          <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">🎵 Search Song</h3>
          <div class="flex space-x-3">
            <input id="search-query" type="text" placeholder="Type song or artist..." class="w-full p-3.5 bg-slate-950/80 border border-white/10 rounded-2xl text-sm focus:outline-none focus:border-indigo-500">
            <button onclick="searchSong()" class="px-6 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 font-bold text-xs rounded-2xl shadow-md">Search</button>
          </div>
          <div id="search-results" class="space-y-2 mt-3"></div>
        </div>

        <div id="host-queue-card" class="space-y-3">
          <div class="flex justify-between items-center px-1">
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Car Queue</h4>
            <button onclick="clearQueue()" class="text-[11px] font-bold px-3 py-1.5 bg-red-600/20 text-red-300 border border-red-500/30 hover:bg-red-600 hover:text-white rounded-xl transition">
              🗑️ Clear Queue
            </button>
          </div>
          <ul id="queue-list" class="space-y-2">
            <li class="p-4 bg-slate-900/40 backdrop-blur-md rounded-2xl text-slate-500 text-sm text-center border border-white/5">Queue is empty</li>
          </ul>
        </div>

      </div>

    </div>

  </div>

  <script>
    const socket = io();
    let currentRoom = null;
    let selectedMode = '🚗 Road Trip';
    let ytPlayer = null;
    let isPlaying = false;
    let isMuted = false;
    let searchCache = [];
    let switchMode = 'replace';

    window.addEventListener('load', () => {
      const savedRoom = sessionStorage.getItem('auxi_host_room');
      const savedMode = sessionStorage.getItem('auxi_host_mode');
      const savedHostName = sessionStorage.getItem('auxi_host_name');

      if (savedRoom) {
        socket.emit('rejoin-host-room', { roomId: savedRoom, hostName: savedHostName, mode: savedMode });
      }
    });

    function setMode(mode) {
      selectedMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'border-indigo-400');
        btn.classList.add('bg-slate-800', 'border-white/10');
      });
      event.target.classList.add('bg-indigo-600', 'border-indigo-400');
    }

    function toggleSwitchMode() {
      const btn = document.getElementById('switch-mode-btn');
      if (switchMode === 'replace') {
        switchMode = 'append';
        btn.innerText = '➕ Mode: Append Queue';
        btn.className = 'text-[10px] font-bold px-3 py-1.5 bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 rounded-xl';
      } else {
        switchMode = 'replace';
        btn.innerText = '🔄 Mode: Replace Queue';
        btn.className = 'text-[10px] font-bold px-3 py-1.5 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded-xl';
      }
    }

    function switchPreset(playlistKey) {
      if (currentRoom) {
        socket.emit('switch-preset-playlist', { roomId: currentRoom, playlistKey, mode: switchMode });
      }
    }

    function clearQueue() {
      if (currentRoom && confirm("Are you sure you want to clear the upcoming queue?")) {
        socket.emit('clear-queue', { roomId: currentRoom });
      }
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        height: '0', width: '0',
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function createRoom() {
      const hostName = document.getElementById('host-name-input').value.trim();
      socket.emit('create-room', { mode: selectedMode, hostName });
    }

    socket.on('room-created', ({ roomId, mode, qrCodeData, hostName }) => {
      currentRoom = roomId;
      sessionStorage.setItem('auxi_host_room', roomId);
      sessionStorage.setItem('auxi_host_mode', mode);
      sessionStorage.setItem('auxi_host_name', hostName);

      document.getElementById('create-card').classList.add('hidden');
      document.getElementById('room-header').classList.remove('hidden');
      document.getElementById('dashboard-grid').classList.remove('hidden');

      document.getElementById('room-code').innerText = roomId;
      document.getElementById('active-mode-tag').innerText = mode;
      document.getElementById('qr-code-img').src = qrCodeData;
    });

    socket.on('members-updated', ({ members }) => {
      document.getElementById('member-count').innerText = `${members.length} Passengers`;
      const list = document.getElementById('members-list');
      if (members.length === 0) {
        list.innerHTML = `<span class="text-slate-500 text-xs">Waiting for passengers...</span>`;
      } else {
        list.innerHTML = members.map(m => `
          <span class="bg-slate-800/80 border border-white/10 text-slate-200 px-3 py-1 rounded-full text-xs font-medium">👤 ${m.name}</span>
        `).join('');
      }
    });

    function sendEmoji(emoji) {
      if (currentRoom) socket.emit('send-reaction', { roomId: currentRoom, emoji });
    }

    socket.on('new-reaction', ({ emoji }) => spawnFloatingEmoji(emoji));

    function spawnFloatingEmoji(emoji) {
      const container = document.getElementById('emoji-container');
      const el = document.createElement('div');
      el.innerText = emoji;
      el.className = 'floating-emoji';
      el.style.left = `${Math.random() * 80 + 10}%`;
      el.style.bottom = '20px';
      container.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    async function searchSong() {
      const queryInput = document.getElementById('search-query');
      if (!queryInput) return;
      const query = queryInput.value.trim();
      if (!query) return;

      const resultsDiv = document.getElementById('search-results');
      resultsDiv.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">Searching songs...</p>`;
      
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        searchCache = await res.json();
        
        if (!searchCache || searchCache.length === 0) {
          resultsDiv.innerHTML = `<p class="text-xs text-slate-500 text-center py-2">No songs found.</p>`;
          return;
        }
        
        resultsDiv.innerHTML = searchCache.map((s, index) => `
          <div class="flex items-center justify-between bg-slate-950/90 p-3 rounded-2xl border border-white/10">
            <div class="flex items-center space-x-3 truncate">
              ${s.thumbnail ? `<img src="${s.thumbnail}" class="w-10 h-10 rounded-lg object-cover">` : ''}
              <div class="truncate">
                <p class="font-medium text-xs text-white truncate">${s.title}</p>
                <p class="text-[10px] text-indigo-300/70">${s.artist}</p>
              </div>
            </div>
            <button onclick="addCachedSong(${index})" class="px-4 py-2 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-xs font-bold rounded-xl shadow flex-shrink-0">
              + Queue
            </button>
          </div>
        `).join('');
      } catch (err) {
        resultsDiv.innerHTML = `<p class="text-xs text-red-400 text-center py-2">Search failed. Try again.</p>`;
      }
    }

    function addCachedSong(index) {
      const song = searchCache[index];
      if (currentRoom && song) {
        socket.emit('add-song', { 
          roomId: currentRoom, 
          song: { title: song.title, videoId: song.videoId, thumbnail: song.thumbnail, artist: song.artist } 
        });
        document.getElementById('search-results').innerHTML = '';
        document.getElementById('search-query').value = '';
      }
    }

    function upvote(songId) {
      if (currentRoom) socket.emit('upvote-song', { roomId: currentRoom, songId });
    }

    socket.on('queue-updated', (data) => {
      renderQueue(data.queue);
      if (!data.currentSong && data.queue.length > 0) {
        socket.emit('song-ended', { roomId: currentRoom });
      }
    });

    socket.on('play-next', (data) => {
      renderQueue(data.queue);
      if (data.currentSong) {
        document.getElementById('now-playing').innerText = data.currentSong.title;
        document.getElementById('added-by').innerText = `Queued by ${data.currentSong.addedBy || 'Driver'}`;
        ytPlayer.loadVideoById(data.currentSong.videoId);
        isPlaying = true;
        document.getElementById('play-btn').innerText = '⏸️ Pause';
      } else {
        document.getElementById('now-playing').innerText = "No active track";
        document.getElementById('added-by').innerText = "";
        isPlaying = false;
        document.getElementById('play-btn').innerText = '▶️ Play';
      }
    });

    function togglePlayPause() {
      if (!ytPlayer) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
        isPlaying = false;
        document.getElementById('play-btn').innerText = '▶️ Play';
        if (currentRoom) socket.emit('player-state-change', { roomId: currentRoom, state: 'pause' });
      } else {
        ytPlayer.playVideo();
        isPlaying = true;
        document.getElementById('play-btn').innerText = '⏸️ Pause';
        if (currentRoom) socket.emit('player-state-change', { roomId: currentRoom, state: 'play' });
      }
    }

    function toggleMute() {
      if (!ytPlayer) return;
      if (isMuted) {
        ytPlayer.unMute();
        isMuted = false;
        document.getElementById('mute-btn').innerText = '🔊';
      } else {
        ytPlayer.mute();
        isMuted = true;
        document.getElementById('mute-btn').innerText = '🔇';
      }
    }

    function skipSong() {
      if (currentRoom) socket.emit('song-ended', { roomId: currentRoom });
    }

    function onPlayerStateChange(event) {
      if (event.data === 0 && currentRoom) {
        socket.emit('song-ended', { roomId: currentRoom });
      }
    }

    function renderQueue(queue) {
      const list = document.getElementById('queue-list');
      if (!queue || queue.length === 0) {
        list.innerHTML = `<li class="p-4 bg-slate-900/40 backdrop-blur-md rounded-2xl text-slate-500 text-sm text-center border border-white/5">Queue is empty</li>`;
        return;
      }
      list.innerHTML = queue.map((song) => `
        <li class="p-3.5 bg-slate-900/60 backdrop-blur-xl rounded-2xl flex items-center justify-between border border-white/10 shadow-lg">
          <div class="flex items-center space-x-3 truncate">
            ${song.thumbnail ? `<img src="${song.thumbnail}" class="w-12 h-12 rounded-xl object-cover border border-white/10">` : ''}
            <div class="truncate">
              <p class="font-medium text-sm text-slate-100 truncate">${song.title}</p>
              <p class="text-xs text-indigo-300/70">By ${song.addedBy}</p>
            </div>
          </div>
          <button onclick="upvote('${song.id}')" class="px-4 py-2 bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 font-bold text-xs rounded-xl hover:bg-indigo-600 hover:text-white transition">
            👍 ${song.votes}
          </button>
        </li>
      `).join('');
    }
  </script>
</body>
</html>
